<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1b3ff" />
      <stop offset="50%" stop-color="#b388ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <linearGradient id="cosmicDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b4e" />
      <stop offset="100%" stop-color="#150d2a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded pill/box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cosmicDark)" stroke="url(#cosmicGrad)" stroke-width="2" />

  <!-- Isometric Craft Cube -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="32,15 48,24 32,33 16,24" fill="#d1b3ff" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="16,24 32,33 32,49 16,40" fill="#9d65ff" opacity="0.85" />
    <!-- Right Face -->
    <polygon points="32,33 48,24 48,40 32,49" fill="#7c4dff" opacity="0.9" />
  </g>

  <!-- Center Cosmic Sparkle / Star -->
  <circle cx="32" cy="33" r="2.5" fill="#ffffff" />
  <path d="M 32,28 L 33,32 L 37,33 L 33,34 L 32,38 L 31,34 L 27,33 L 31,32 Z" fill="#ffffff" opacity="0.9" />
</svg>
