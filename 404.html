<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>404 &mdash; Resource Not Found | CraftIndex</title>
    <meta name="description" content="The requested page or resource could not be found on CraftIndex." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://craftindex.inlooker.top/404" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://craftindex.inlooker.top/404" />
    <meta property="og:title" content="404 &mdash; Resource Not Found | CraftIndex" />
    <meta property="og:description" content="The requested page or resource could not be found on CraftIndex." />
    <meta property="og:image" content="https://craftindex.inlooker.top/images/bigger-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon Suite -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />

    <link rel="stylesheet" href="css/styles.css?v=2.6.1" />
    <style>
      .error-page-wrap {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }
      .error-glass-card {
        background: rgba(22, 17, 38, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(179, 136, 255, 0.25);
        border-radius: 20px;
        padding: 48px 36px;
        max-width: 560px;
        width: 100%;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .error-code {
        font-size: 72px;
        font-weight: 900;
        background: linear-gradient(135deg, #d1b3ff, #9d65ff, #7c4dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 16px;
        letter-spacing: -0.04em;
      }
      .error-title {
        font-size: 24px;
        font-weight: 700;
        color: #fcf4ff;
        margin-bottom: 12px;
      }
      .error-desc {
        font-size: 15px;
        color: #a79bbd;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .error-actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        background: linear-gradient(135deg, #7c4dff, #b388ff) !important;
        color: #ffffff !important;
        font-weight: 700 !important;
        padding: 10px 22px !important;
        border-radius: 10px !important;
        text-decoration: none !important;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(124, 77, 255, 0.4);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.08) !important;
        color: #fcf4ff !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        padding: 10px 20px !important;
        border-radius: 10px !important;
        text-decoration: none !important;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="lg" id="lg" aria-label="CraftIndex Home">
        <img src="images/craftindex-logo.png" alt="CraftIndex Logo" width="36" height="36" />
        <span>CraftIndex</span>
      </a>
      <span style="flex: 1"></span>
    </header>

    <main>
      <div class="error-page-wrap">
        <div class="error-glass-card">
          <div class="error-code">404</div>
          <h1 class="error-title">Resource Not Found</h1>
          <p class="error-desc">
            The requested Minecraft resource category, route, or asset does not exist on CraftIndex or has moved.
          </p>
          <div class="error-actions">
            <a href="/" class="btn-primary">Return to Homepage</a>
            <a href="/docs/" class="btn-secondary">Browse Documentation</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
